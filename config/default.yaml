data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  obs_len: 25
  pred_len: 25
  stride: 5
  r_thresh: 10.0
  field_length: 105.0
  field_width: 68.0

model:
  d_c: 32
  d_h: 64
  gcn_layers: 2
  ode_method: "euler"
  ode_rtol: 1.0e-3
  ode_atol: 1.0e-4

train:
  batch_size: 32
  lr: 1.0e-3
  epochs: 100
  weight_decay: 1.0e-4
  device: "cuda"
